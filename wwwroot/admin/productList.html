<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management — Admin</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-table img {
            width: 40px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--c-border);
        }

        .size-qty-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-top: 10px;
        }

            .size-qty-grid input {
                text-align: center;
                padding: 5px;
            }

            .size-qty-grid label {
                font-size: 11px;
                display: block;
                text-align: center;
                font-weight: bold;
            }
    </style>
</head>
<body>
    <div class="admin-layout">
        <div id="admin-nav-container"></div>

        <div class="admin-content">
            <div class="admin-header">
                <h1>Product Management</h1>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 400px; gap: 24px;">

                <div>
                    <div class="filter-bar" style="margin-bottom: 15px; display: flex; gap: 10px;">
                        <input type="text" id="srch" placeholder="Search name..." class="form-control" style="flex:1">
                        <select id="catF" class="form-control" style="width: 150px;"></select>
                    </div>

                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Product Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="tbody">
                        </tbody>
                    </table>
                </div>

                <div class="form-card">
                    <h3 id="formTitle">Add New Product</h3>
                    <form id="productForm">
                        <input type="hidden" id="eID">

                        <div class="form-group">
                            <label>Product Name *</label>
                            <input type="text" id="eName" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label>Category *</label>
                            <select id="eCat" class="form-control" required></select>
                        </div>

                        <div class="form-group">
                            <label>Price (₫) *</label>
                            <input type="number" id="ePrice" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label>Image URL</label>
                            <input type="text" id="eImg" class="form-control">
                        </div>

                        <div class="form-group">
                            <label>Stock per Size (S, M, L, XL, XXL)</label>
                            <div class="size-qty-grid">
                                <div><label>S</label><input type="number" id="eS_S" value="0" class="form-control"></div>
                                <div><label>M</label><input type="number" id="eS_M" value="0" class="form-control"></div>
                                <div><label>L</label><input type="number" id="eS_L" value="0" class="form-control"></div>
                                <div><label>XL</label><input type="number" id="eS_XL" value="0" class="form-control"></div>
                                <div><label>XXL</label><input type="number" id="eS_XXL" value="0" class="form-control"></div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="eDesc" class="form-control" rows="3"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Save Product</button>
                        <button type="button" class="btn btn-outline btn-full" style="margin-top:10px" onclick="resetForm()">Cancel / Clear</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script>
        loadAdminNav();
        const token = localStorage.getItem('token');
        const SIZES = ['S', 'M', 'L', 'XL', 'XXL'];

        async function init() {
            try {
                const catRes = await fetch(`${API_BASE_URL}/Categories`);
                const categories = await catRes.json();
                const eCat = document.getElementById('eCat');
                const catF = document.getElementById('catF');

                let catOptions = categories.map(c => `<option value="${c.categoryId}">${c.categoryName}</option>`).join('');
                eCat.innerHTML = '<option value="">-- Select Category --</option>' + catOptions;
                catF.innerHTML = '<option value="">All Categories</option>' + catOptions;

                loadProducts();
            } catch (err) { console.error(err); }
        }

        async function loadProducts() {
            try {
                const res = await fetch(`${API_BASE_URL}/Products?pageSize=1000`);
                const data = await res.json();
                const items = data.items || data;

                const tbody = document.getElementById('tbody');
                tbody.innerHTML = items.map(p => {
                    const tot = p.totalStock || 0;
                    return `
                        <tr>
                            <td><img src="${p.img || '/img/no-image.png'}" alt=""></td>
                            <td><strong>${p.productName}</strong></td>
                            <td>${p.categoryName}</td>
                            <td style="color:var(--c-accent); font-weight:bold;">${formatCurrency(p.price)}</td>
                            <td>${tot}</td>
                            <td>
                                <button class="btn btn-sm btn-outline" onclick="editProduct('${p.productId}')">Edit</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteProduct('${p.productId}')">Delete</button>
                            </td>
                        </tr>`;
                }).join('');
            } catch (err) { console.error(err); }
        }

        async function editProduct(id) {
            const res = await fetch(`${API_BASE_URL}/Products/${id}`);
            const p = await res.json();

            document.getElementById('eID').value = p.productId;
            document.getElementById('eName').value = p.productName;
            document.getElementById('eCat').value = p.categoryId;
            document.getElementById('ePrice').value = p.price;
            document.getElementById('eImg').value = p.img || '';
            document.getElementById('eDesc').value = p.description || '';

            if (p.sizeQuantities) {
                SIZES.forEach(s => {
                    document.getElementById('eS_' + s).value = p.sizeQuantities[s] || 0;
                });
            }

            document.getElementById('formTitle').innerText = 'Edit Product';
            document.getElementById('submitBtn').innerText = 'Update Product';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('productForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('eID').value;

            const payload = {
                productName: document.getElementById('eName').value,
                categoryId: document.getElementById('eCat').value,
                price: parseFloat(document.getElementById('ePrice').value),
                img: document.getElementById('eImg').value,
                description: document.getElementById('eDesc').value,
                sizeQuantities: {
                    'S': parseInt(document.getElementById('eS_S').value) || 0,
                    'M': parseInt(document.getElementById('eS_M').value) || 0,
                    'L': parseInt(document.getElementById('eS_L').value) || 0,
                    'XL': parseInt(document.getElementById('eS_XL').value) || 0,
                    'XXL': parseInt(document.getElementById('eS_XXL').value) || 0
                }
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_BASE_URL}/Products/${id}` : `${API_BASE_URL}/Products`;

            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert(id ? 'Updated successfully!' : 'Added successfully!');
                resetForm();
                loadProducts();
            } else {
                alert('Operation failed!');
            }
        };

        async function deleteProduct(id) {
            if (confirm('Delete this product?')) {
                await fetch(`${API_BASE_URL}/Products/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                loadProducts();
            }
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('eID').value = '';
            document.getElementById('formTitle').innerText = 'Add New Product';
            document.getElementById('submitBtn').innerText = 'Save Product';
        }

        document.getElementById('srch').addEventListener('input', loadProducts);
        document.getElementById('catF').addEventListener('change', loadProducts);

        init();
    </script>
</body>
</html>
