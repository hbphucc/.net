<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Management — Admin</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <div id="admin-nav-container"></div>

        <div class="admin-content">
            <div class="admin-header">
                <h1>Order Management</h1>
                <span style="color:var(--c-muted);font-size:14px;"><span id="orderCount">0</span> orders</span>
            </div>

            <div class="filter-bar" style="margin-bottom:24px;" id="statusFilters">
                <a href="#" data-status="" class="active" onclick="filterOrders(event, '')">All</a>
                <a href="#" data-status="pending" onclick="filterOrders(event, 'pending')">Pending</a>
                <a href="#" data-status="processing" onclick="filterOrders(event, 'processing')">Processing</a>
                <a href="#" data-status="shipped" onclick="filterOrders(event, 'shipped')">Shipped</a>
                <a href="#" data-status="delivered" onclick="filterOrders(event, 'delivered')">Delivered</a>
                <a href="#" data-status="cancelled" onclick="filterOrders(event, 'cancelled')">Cancelled</a>
            </div>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Total Amount</th>
                        <th>Payment</th>
                        <th>Status</th>
                        <th>Order Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="orderTableBody">
                </tbody>
            </table>

        </div>
    </div>

    <script src="/js/common.js"></script>
    <script>
        loadAdminNav();

        const token = localStorage.getItem('token');

        function getStatusLabel(status) {
            switch (status) {
                case 'pending': return 'Pending';
                case 'processing': return 'Processing';
                case 'shipped': return 'Shipped';
                case 'delivered': return 'Delivered';
                case 'cancelled': return 'Cancelled';
                default: return status;
            }
        }

        async function loadOrders(statusFilter = '') {
            try {
                // SỬA LỖI 404 TẠI ĐÂY: Bỏ chữ /Admin đi
                let url = `${API_BASE_URL}/Orders`;
                if (statusFilter !== '') {
                    url += `?status=${statusFilter}`;
                }

                const res = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) {
                        alert("Unauthorized! Please log in again.");
                        window.location.href = '/login.html';
                    } else {
                        console.error("Failed to fetch orders, status:", res.status);
                    }
                    return;
                }

                const data = await res.json();
                let orders = [];
                if (Array.isArray(data)) {
                    orders = data;
                } else if (data && data.items && Array.isArray(data.items)) {
                    orders = data.items;
                }

                const tbody = document.getElementById('orderTableBody');
                if (!tbody) return;

                if (orders.length === 0) {
                    document.getElementById('orderCount').innerText = "0";
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;">No orders found.</td></tr>';
                    return;
                }

                document.getElementById('orderCount').innerText = orders.length;

                tbody.innerHTML = orders.map(o => `
                    <tr>
                        <td style="font-family:monospace;font-size:12px;">#${o.orderId ? o.orderId.substring(0, 8).toUpperCase() : 'N/A'}</td>
                        <td>
                            <div>${o.fullName || o.userFullName || 'N/A'}</div>
                            <div style="font-size:12px;color:var(--c-muted);">${o.phone || ''}</div>
                        </td>
                        <td style="font-weight:600;color:var(--c-accent);">
                            ${(o.totalAmount || 0).toLocaleString('vi-VN')} ₫
                        </td>
                        <td>${o.paymentMethod || 'N/A'}</td>
                        <td><span class="badge badge-${o.status}">${getStatusLabel(o.status)}</span></td>
                        <td style="font-size:13px;color:var(--c-muted);">${o.createdAt ? new Date(o.createdAt).toLocaleString('vi-VN') : 'N/A'}</td>
                        <td>
                            <a href="/admin/orderDetail.html?id=${o.orderId}" class="btn btn-outline btn-sm">
                                <i class="fas fa-eye"></i> Details
                            </a>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Error loading orders:", err);
            }
        }

        function filterOrders(event, status) {
            event.preventDefault();

            const links = document.querySelectorAll('#statusFilters a');
            links.forEach(link => link.classList.remove('active'));

            event.target.classList.add('active');

            loadOrders(status);
        }

        loadOrders();
    </script>
</body>
</html>
